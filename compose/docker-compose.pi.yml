# AllArkive Pi — text-only stack (deployment pattern B)
#
# For Raspberry Pi 4 or 5 with a USB SSD mounted at /mnt/ssd.
# Differences from the laptop stack:
#   - Data directory defaults to /mnt/ssd/allarkive (USB SSD, not /var/lib)
#   - Ollama memory cap to avoid OOM on low-RAM Pi
#   - No GPU profile (Pi has no CUDA)
#   - Healthcheck grace periods extended (Pi is slower to start)
#   - Recommended bundle: minimal (fetch with: scripts/fetch-bundle.sh minimal)
#   - Recommended model: see OLLAMA_DEFAULT_MODEL in compose/.env
#
# Usage (from repo root):
#   cd compose/
#   docker compose -f docker-compose.pi.yml up -d
#
# See docs/deployment/pi-text-only.md for the full walkthrough.
#
# DIGEST PINNING: same requirement as docker-compose.yml — pin images to
# SHA-256 digests before use. ARM images are pulled automatically by Docker.

services:

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      zims=$$(find /data -maxdepth 1 -name '*.zim' | sort | tr '\n' ' ' | xargs echo)
      if [ -z "$$zims" ]; then
        printf 'ERROR: no ZIM files found in /data.\n'
        printf 'Run: ./scripts/fetch-bundle.sh minimal\n'
        exit 1
      fi
      exec kiwix-serve --port 8080 --address 0.0.0.0 $$zims
    ports:
      - "127.0.0.1:${KIWIX_PORT:-8081}:8080"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/mnt/ssd/allarkive}/zim:/data:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:0.22.1
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/mnt/ssd/allarkive}/models:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.2
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/mnt/ssd/allarkive}/data:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in compose/.env}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP:-false}
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=1
      - SCARF_NO_ANALYTICS=true
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
