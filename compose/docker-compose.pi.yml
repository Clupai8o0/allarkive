# AllArkive Pi — text-only stack (deployment pattern B)
#
# For Raspberry Pi 4 or 5 with a USB SSD mounted at /mnt/ssd.
# Differences from the laptop stack:
#   - Data directory defaults to /mnt/ssd/allarkive (USB SSD, not /var/lib)
#   - Ollama memory cap to avoid OOM on low-RAM Pi (default 4G)
#   - Default chat model: qwen2.5:1.5b (fits Pi 4 with 4 GB RAM)
#   - No GPU profile (Pi has no CUDA)
#   - Healthcheck grace periods extended (Pi is slower to start)
#   - Recommended bundle: minimal (fetch with: scripts/fetch-bundle.sh minimal)
#
# Usage (from repo root):
#   scripts/bootstrap.sh --pi --bundle minimal
# or manually:
#   cd compose/
#   docker compose -f docker-compose.pi.yml up -d
#
# See docs/deployment/pi-text-only.md for the full walkthrough.
#
# Images are pinned to SHA-256 digests (multi-arch manifests; Docker picks
# the right platform automatically). To update, see docker-compose.yml header.

services:

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:0b6541355b250c6b45d2d7725e88f22f1d6a0f45ad9480d9c0bd4bc58436a12f
    entrypoint: ["/bin/sh", "-c"]
    command: |
      while true; do
        zims=$$(find /data -maxdepth 1 -name '*.zim' | sort | tr '\n' ' ')
        if [ -n "$$zims" ]; then
          exec kiwix-serve --port 8080 --address 0.0.0.0 $$zims
        fi
        printf 'No ZIM files in /data — retrying in 30s.\n'
        printf 'Fetch a bundle: scripts/fetch-bundle.sh minimal\n'
        sleep 30
      done
    ports:
      - "127.0.0.1:${KIWIX_PORT:-8081}:8080"
    volumes:
      - "${ALLARKIVE_ZIM_DIR:-/mnt/ssd/allarkive/zim}:/data:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:0.22.1@sha256:3ca37ec2b9cb6341b62554074205c616778fe98abcf9e4fc50361b79a07407ae
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${ALLARKIVE_MODELS_DIR:-/mnt/ssd/allarkive/models}:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  rag:
    build:
      context: ../scripts/rag
    image: allarkive-rag:0.1.0
    pull_policy: build
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - INDEX_DIR=/index
      - ZIM_DIR=/data
      - KIWIX_PUBLIC_URL=${KIWIX_PUBLIC_URL:-http://127.0.0.1:8081}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # Pi default: qwen2.5:1.5b fits in 4 GB RAM with headroom for the OS.
      # Use qwen2.5:3b on an 8 GB Pi 4 or Pi 5.
      - CHAT_MODEL=${CHAT_MODEL:-qwen2.5:1.5b}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MAX_DISTANCE=${RAG_MAX_DISTANCE:-1.0}
      - RAG_MAX_ARTICLES=${RAG_MAX_ARTICLES:-3000}
    volumes:
      - "${ALLARKIVE_INDEX_DIR:-/mnt/ssd/allarkive/index}:/index"
      - "${ALLARKIVE_ZIM_DIR:-/mnt/ssd/allarkive/zim}:/data:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  landing:
    image: nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
    ports:
      - "127.0.0.1:${LANDING_PORT:-8080}:8080"
    volumes:
      - ../landing:/usr/share/nginx/html:ro
      - ../landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.2@sha256:a7e4796ae894d1e2a0c1824860ade472f35c507608a01c3581377b5c19b0ed49
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - "${ALLARKIVE_WEBUI_DIR:-/mnt/ssd/allarkive/data}:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in compose/.env}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP:-false}
      # Expose the RAG service as an OpenAI-compatible model inside Open WebUI.
      - OPENAI_API_BASE_URLS=http://rag:8000/v1
      - OPENAI_API_KEYS=${RAG_API_KEY:-allarkive}
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=1
      - SCARF_NO_ANALYTICS=true
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
