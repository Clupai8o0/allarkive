# AllArkive Pi — archive-only stack (deployment pattern C)
#
# For Raspberry Pi 4 or 5 running kiwix-serve only.
# No AI layer (no Ollama, no RAG). Use this when the Pi is a dedicated
# archive node and the AI runs on a separate machine (see split deployment:
# docs/deployment/split.md).
#
# Requirements:
#   - USB SSD mounted at /mnt/ssd (do not run from SD card)
#   - At least 8 GB free on the SSD for the minimal bundle
#   - Docker Engine 24+ with the Compose plugin
#
# Usage (from repo root):
#   scripts/fetch-bundle.sh minimal --dest /mnt/ssd/allarkive/zim
#   cd compose/
#   docker compose -f docker-compose.pi-archive.yml up -d
#
# See docs/deployment/pi-archive-only.md for the full walkthrough.
#
# Image is pinned to a SHA-256 digest. To update, pull the new tag and
# replace the digest with the output of:
#   docker buildx imagetools inspect IMAGE:TAG --format "{{json .Manifest}}"

services:

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:0b6541355b250c6b45d2d7725e88f22f1d6a0f45ad9480d9c0bd4bc58436a12f
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      zims=$$(find /data -maxdepth 1 -name '*.zim' | sort | tr '\n' ' ' | xargs echo)
      if [ -z "$$zims" ]; then
        printf 'ERROR: no ZIM files found in /data.\n'
        printf 'Run: ./scripts/fetch-bundle.sh minimal --dest /mnt/ssd/allarkive/zim\n'
        exit 1
      fi
      exec kiwix-serve --port 8080 --address 0.0.0.0 $$zims
    ports:
      # Default: loopback only. For LAN access from another machine (split deployment),
      # change 127.0.0.1 to 0.0.0.0 and secure with a firewall or reverse proxy.
      # See docs/deployment/split.md before exposing to the network.
      - "${KIWIX_BIND:-127.0.0.1}:${KIWIX_PORT:-8081}:8080"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/mnt/ssd/allarkive}/zim:/data:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
