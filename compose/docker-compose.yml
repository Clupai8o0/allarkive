# AllArkive — default stack
#
# Requires: Docker Engine 24+ with the Compose plugin.
# Copy compose/.env.example to compose/.env and fill in WEBUI_SECRET_KEY
# before running.
#
# Images are pinned to SHA-256 digests. To update, pull the new tag and
# replace the digest with the output of:
#   docker buildx imagetools inspect IMAGE:TAG --format "{{json .Manifest}}"
#
# Usage:
#   cd compose/
#   docker compose up -d
#
# For GPU support (Ollama inference acceleration):
#   docker compose --profile gpu up -d

services:

  # ── Layer 1: Archive ────────────────────────────────────────────────────────
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:0b6541355b250c6b45d2d7725e88f22f1d6a0f45ad9480d9c0bd4bc58436a12f
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      zims=$$(find /data -maxdepth 1 -name '*.zim' | sort | tr '\n' ' ' | xargs echo)
      if [ -z "$$zims" ]; then
        printf 'ERROR: no ZIM files found in /data.\n'
        printf 'Run: ./scripts/fetch-bundle.sh balanced\n'
        exit 1
      fi
      exec kiwix-serve --port 8080 --address 0.0.0.0 $$zims
    ports:
      - "127.0.0.1:${KIWIX_PORT:-8081}:8080"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/zim:/data:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Layer 2a: AI ─────────────────────────────────────────────────────────────
  #
  # CPU-only variant (default). For GPU acceleration, use the `gpu` profile:
  #   docker compose --profile gpu up -d
  ollama:
    image: ollama/ollama:0.22.1@sha256:3ca37ec2b9cb6341b62554074205c616778fe98abcf9e4fc50361b79a07407ae
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/models:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-gpu:
    image: ollama/ollama:0.22.1@sha256:3ca37ec2b9cb6341b62554074205c616778fe98abcf9e4fc50361b79a07407ae
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/models:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Layer 2b: Chat UI ─────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.2@sha256:a7e4796ae894d1e2a0c1824860ade472f35c507608a01c3581377b5c19b0ed49
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/data:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in compose/.env (run: openssl rand -hex 32)}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP:-false}
      # Expose the RAG service as an OpenAI-compatible model inside Open WebUI.
      # Users will see "allarkive-rag" in the model picker alongside Ollama models.
      - OPENAI_API_BASE_URLS=http://rag:8000/v1
      - OPENAI_API_KEYS=${RAG_API_KEY:-allarkive}
      # Telemetry — AllArkive never phones home.
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=1
      - SCARF_NO_ANALYTICS=true
    depends_on:
      ollama:
        condition: service_healthy
      rag:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ── Layer 2c: RAG pipeline ────────────────────────────────────────────────────
  rag:
    build:
      context: ../scripts/rag
    image: allarkive-rag:0.1.0
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - INDEX_DIR=/index
      - ZIM_DIR=/data
      - KIWIX_PUBLIC_URL=${KIWIX_PUBLIC_URL:-http://127.0.0.1:8081}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - CHAT_MODEL=${CHAT_MODEL:-qwen2.5:7b}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MAX_DISTANCE=${RAG_MAX_DISTANCE:-1.0}
      - RAG_MAX_ARTICLES=${RAG_MAX_ARTICLES:-5000}
    volumes:
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/index:/index"
      - "${ALLARKIVE_DATA_DIR:-/var/lib/allarkive}/zim:/data:ro"
    depends_on:
      ollama:
        condition: service_healthy
      kiwix:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Layer 3: Landing page ─────────────────────────────────────────────────────
  landing:
    image: nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
    ports:
      - "127.0.0.1:${LANDING_PORT:-8080}:8080"
    volumes:
      - ../landing:/usr/share/nginx/html:ro
      - ../landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
