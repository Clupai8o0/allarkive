name: Mirror to Codeberg

on:
  push:
    branches: [main]

jobs:
  mirror:
    name: Push mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg "https://Clupai8o0:${CODEBERG_TOKEN}@codeberg.org/allarkive/allarkive.git"
          git push codeberg main --force-with-lease
